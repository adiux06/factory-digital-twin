[project]
name = "factorytwin-backend"
version = "0.1.0"
description = "FactoryTwin — Intelligent Factory Simulation and AI Inspection Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.0",
    "websockets>=13.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0",
    "scikit-learn>=1.5.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
